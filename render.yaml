services:
  - type: web
    name: hackathon-registration-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CHATBOT_REFUSAL_MESSAGE
        value: "I can only help with questions about the Hack the Future hackathon and this website, such as registration, teams, schedule, rules, prizes and support. Please ask me something about those."
      - key: CHATBOT_MAX_MESSAGE_LENGTH
        value: "500"
